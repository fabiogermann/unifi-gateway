name: Publish .pkg to ArtifactKeeper

# Builds the FreeBSD .pkg inside a real FreeBSD 15 VM (vmactions/freebsd-vm,
# QEMU/KVM on the standard ubuntu-latest runner — no self-hosted runner;
# PyInstaller cannot cross-compile, so the build runs natively under a
# FreeBSD kernel). Then uploads to the ArtifactKeeper 'freebsd-pkg'
# repository through Cloudflare Access. Upload is fail-closed: only HTTP 201
# counts (see ci/upload-ak.sh).
#
# Required secrets (repo settings):
#   AK_API_TOKEN              — AK repo-scoped token (github-ci-unifi-gateway) with
#                               read:artifacts + write:artifacts on freebsd-pkg
#   AK_CF_ACCESS_CLIENT_ID    — Cloudflare Access service token id
#   AK_CF_ACCESS_CLIENT_SECRET— Cloudflare Access service token secret
#   AK_URL                    — e.g. https://ak.intra.sh

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.9.9-rc1)'
        required: true

permissions:
  contents: read

env:
  ABI: FreeBSD:15:amd64
  AK_REPO: freebsd-pkg
  PYINSTALLER_ARGS: >-
    --onefile
    --name unifi-gateway
    --hidden-import Crypto.Cipher._mode_cbc
    --hidden-import Crypto.Cipher._mode_gcm
    --hidden-import Crypto.Cipher._mode_ecb
    --hidden-import Crypto.Util.Padding
    --hidden-import Crypto.Random
    unifi_gateway.py

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build binary + .pkg in a FreeBSD 15 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          cpu: 3
          envs: |
            VERSION
          # py313-pip does not exist in the FreeBSD 15 pkg repo. Discover the
          # newest available pip flavor — via a plain substring search piped
          # through grep, because pkg's own pattern dialect varies by version.
          prepare: |
            set -e
            uname -a
            pip_pkg=$(pkg search -q pip | grep -E '^py3[0-9]+-pip-[0-9]' | sort -V | tail -n1 || true)
            if [ -z "$pip_pkg" ]; then
              echo "::error::no py3x-pip flavor found; candidates were:"
              pkg search pip | head -30
              exit 1
            fi
            echo "Selected pip package: $pip_pkg"
            pkg install -y "$pip_pkg"
            pyver=$(echo "$pip_pkg" | sed -E 's/^py([0-9])([0-9]+)-pip-.*/\1.\2/')
            ln -sf "/usr/local/bin/python$pyver" /usr/local/bin/python3
            python3 --version
          cache-after-prepare: true
          # Byte-aligned with the proven build-freebsd step in release.yml:
          # no extra envs, single-line PyInstaller; build-pkg.sh defaults
          # ABI to FreeBSD:15:amd64 itself.
          run: |
            set -e
            python3 -m pip install --break-system-packages -r requirements.txt pyinstaller
            python3 -m PyInstaller ${{ env.PYINSTALLER_ARGS }}
            ./dist/unifi-gateway --help
            chmod +x pkg/freebsd/build-pkg.sh
            sh pkg/freebsd/build-pkg.sh "$VERSION"

      # copyback (default true) rsyncs the workspace — including dist/*.pkg —
      # back from the VM onto this runner.
      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-pkg
          path: dist/*.pkg
          retention-days: 5

  # Note: the `env` context is not allowed in jobs.<id>.name — keep it static.
  publish-ak:
    name: Upload to AK
    needs: [build-pkg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AK_API_TOKEN: ${{ secrets.AK_API_TOKEN }}
      AK_CF_ACCESS_CLIENT_ID: ${{ secrets.AK_CF_ACCESS_CLIENT_ID }}
      AK_CF_ACCESS_CLIENT_SECRET: ${{ secrets.AK_CF_ACCESS_CLIENT_SECRET }}
      AK_URL: ${{ secrets.AK_URL }}
    steps:
      # checkout is required: ci/upload-ak.sh lives in the repo, the artifact
      # download only carries dist/*.pkg.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: freebsd-pkg
          path: dist

      - name: Guard required configuration
        run: |
          set -e
          missing=0
          for v in AK_API_TOKEN AK_CF_ACCESS_CLIENT_ID AK_CF_ACCESS_CLIENT_SECRET AK_URL; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::$v is not set (secrets/variables — see workflow header)"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

      - name: Upload .pkg
        run: |
          chmod +x ci/upload-ak.sh
          for pkg in dist/*.pkg; do
            ./ci/upload-ak.sh "$pkg" "$AK_REPO" "$ABI"
          done

      - name: Summary
        if: success()
        run: |
          for pkg in dist/*.pkg; do
            echo "- \`${pkg##*/}\` -> \`$AK_REPO/$ABI\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Catalogue refresh is server-side; verify with \`pkg rquery\` after the next refresh cycle." >> "$GITHUB_STEP_SUMMARY"
