name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  PYINSTALLER_ARGS: >-
    --onefile
    --name unifi-gateway
    --hidden-import Crypto.Cipher._mode_cbc
    --hidden-import Crypto.Cipher._mode_gcm
    --hidden-import Crypto.Cipher._mode_ecb
    --hidden-import Crypto.Util.Padding
    --hidden-import Crypto.Random
    unifi_gateway.py

jobs:
  # ── Build PyInstaller binaries ──────────────────────────────────────

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            suffix: linux-amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            suffix: linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
          - arch: armhf
            platform: linux/arm/v7
            suffix: linux-armhf
            deb_arch: armhf
            rpm_arch: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary + packages
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/build -w /build \
            python:3.12-slim bash -c '
              set -e
              apt-get update && apt-get install -y --no-install-recommends \
                gcc libc6-dev zlib1g-dev dpkg-dev debhelper binutils build-essential

              # Build PyInstaller binary
              pip install --no-cache-dir -r requirements.txt pyinstaller
              pyinstaller ${{ env.PYINSTALLER_ARGS }}
              ./dist/unifi-gateway --help
              cp dist/unifi-gateway dist/unifi-gateway-${{ matrix.suffix }}

              # Build .deb
              sed -i "1s/([^)]*)/('"${{ steps.version.outputs.version }}"'-1)/" debian/changelog
              dpkg-buildpackage -us -uc -b -a${{ matrix.deb_arch }}
              mkdir -p output
              mv ../*.deb output/
            '

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/unifi-gateway-${{ matrix.suffix }}

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: output/*.deb

      - name: Build RPM
        if: matrix.rpm_arch != ''
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/build -w /build \
            rockylinux:9 bash -c '
              set -e
              VERSION='"${{ steps.version.outputs.version }}"'
              RPM_VERSION=$(echo "$VERSION" | tr - .)
              dnf install -y rpm-build systemd-rpm-macros

              mkdir -p /root/rpmbuild/{SOURCES,SPECS}
              tar czf /root/rpmbuild/SOURCES/unifi-gateway-${RPM_VERSION}.tar.gz \
                --transform "s,^\.,unifi-gateway-${RPM_VERSION}," \
                --exclude=.git --exclude=__pycache__ --exclude=poc .
              cp rpm/unifi-gateway.spec /root/rpmbuild/SPECS/
              rpmbuild -bb --define "_version ${RPM_VERSION}" /root/rpmbuild/SPECS/unifi-gateway.spec
              mkdir -p /build/output
              cp /root/rpmbuild/RPMS/*/*.rpm /build/output/
            '

      - name: Upload RPM
        if: matrix.rpm_arch != ''
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: output/*.rpm

  # Fork: no self-hosted FreeBSD runner. Build inside a real FreeBSD 15 VM
  # (vmactions/freebsd-vm, QEMU/KVM on ubuntu-latest) — PyInstaller cannot
  # cross-compile, so the build runs natively under a FreeBSD kernel.
  build-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build binary + .pkg in a FreeBSD 15 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          cpu: 3
          envs: |
            VERSION
          # py313-pip does not exist in the FreeBSD 15 pkg repo. Discover the
          # newest available pip flavor — via a plain substring search piped
          # through grep, because pkg's own pattern dialect varies by version.
          prepare: |
            set -e
            uname -a
            pip_pkg=$(pkg search -q pip | grep -E '^py3[0-9]+-pip-[0-9]' | sort -V | tail -n1 || true)
            if [ -z "$pip_pkg" ]; then
              echo "::error::no py3x-pip flavor found; candidates were:"
              pkg search pip | head -30
              exit 1
            fi
            echo "Selected pip package: $pip_pkg"
            pkg install -y "$pip_pkg"
            pyver=$(echo "$pip_pkg" | sed -E 's/^py([0-9])([0-9]+)-pip-.*/\1.\2/')
            ln -sf "/usr/local/bin/python$pyver" /usr/local/bin/python3
            python3 --version
          cache-after-prepare: true
          run: |
            set -e
            python3 -m pip install --break-system-packages -r requirements.txt pyinstaller
            python3 -m PyInstaller ${{ env.PYINSTALLER_ARGS }}
            ./dist/unifi-gateway --help
            cp dist/unifi-gateway dist/unifi-gateway-freebsd-amd64
            chmod +x pkg/freebsd/build-pkg.sh
            sh pkg/freebsd/build-pkg.sh "$VERSION"

      # copyback (default true) rsyncs dist/ back from the VM.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-freebsd-amd64
          path: dist/unifi-gateway-freebsd-amd64

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: pkg-freebsd-amd64
          path: dist/*.pkg

  # ── OpenWRT packages (pure Python, arch-independent) ──────────────

  build-openwrt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .ipk (opkg, pre-25.12)
        run: |
          chmod +x pkg/openwrt/build-ipk.sh
          ./pkg/openwrt/build-ipk.sh "${{ steps.version.outputs.version }}"

      - name: Build .apk (apk, 25.12+)
        run: |
          chmod +x pkg/openwrt/build-apk.sh
          ./pkg/openwrt/build-apk.sh "${{ steps.version.outputs.version }}"

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipk
          path: dist/*.ipk

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-apk
          path: dist/*.apk

  # ── Docker multi-arch image ────────────────────────────────────────

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fabiogermann/unifi-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── GitHub Release ─────────────────────────────────────────────────

  release:
    needs: [build-linux, build-freebsd, build-openwrt]
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: binary-*
          merge-multiple: true

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '{deb,rpm,pkg,openwrt}-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/unifi-gateway-*
            packages/*.deb
            packages/*.rpm
            packages/*.pkg
            packages/*.ipk
            packages/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Upstream publishes to packages.alejandro.md via a repository dispatch.
  # This fork publishes the FreeBSD .pkg to ArtifactKeeper instead —
  # see .github/workflows/publish-ak.yml.
