[start]
command:/usr/local/etc/rc.d/unifi_gateway start
type:script
description:Start UniFi gateway emulator

[stop]
command:/usr/local/etc/rc.d/unifi_gateway stop
type:script
description:Stop UniFi gateway emulator

[restart]
command:/usr/local/etc/rc.d/unifi_gateway restart
type:script
description:Restart UniFi gateway emulator

[status]
command:/usr/local/etc/rc.d/unifi_gateway status;exit 0
type:script_output
description:Show UniFi gateway emulator status

[generate-config]
command:/usr/local/opnsense/scripts/OPNsense/UnifiGateway/generate_config.py
type:script
description:Generate unifi-gateway.conf from config.xml

[adopt]
command:/usr/local/opnsense/scripts/OPNsense/UnifiGateway/adopt.py
type:script_output
errors:no
description:Run the controller adoption handshake (inform/enroll)

[adoption-status]
command:/usr/local/opnsense/scripts/OPNsense/UnifiGateway/adoption_status.py
type:script_output
description:Report controller adoption state as JSON
